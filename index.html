<!DOCTYPE html>
<!--
  REDIRECTION VERS LA BOUTIQUE (Apps Script). Le domaine boutique.fsggb.fr ne sert plus la boutique lui-meme :
  il renvoie vers l'adresse AVEC le domaine Workspace (/a/macros/fsggb.fr/...), qui s'ouvre quel que soit le compte
  Google connecte. Les parametres de l'adresse (?a=, ?r=, ?mode=...) sont transmis ; MODE_PAR_DEFAUT depend de la page
  (index = client, vendeur/, admin/, test/ : meme fichier avec une autre valeur).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique GDB</title>
<style>
  html, body { margin: 0; height: 100%; font-family: Georgia, serif; color: #0b1a6b; background: #fff; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #0b1a6b; }
</style>
</head>
<body>
<p>Ouverture de la boutique…<br><a id="lien" href="https://script.google.com/a/macros/fsggb.fr/s/AKfycbwW5GeOkiFxzGFXulOqIjNqGaZEMEk8QnHiHujMLhS59MN09ECAXTZITMmCuFcn3aLD/exec">Cliquez ici si rien ne se passe.</a></p>
<script>
(function () {
  var MODE_PAR_DEFAUT = "";
  var base = "https://script.google.com/a/macros/fsggb.fr/s/AKfycbwW5GeOkiFxzGFXulOqIjNqGaZEMEk8QnHiHujMLhS59MN09ECAXTZITMmCuFcn3aLD/exec";
  var params = new URLSearchParams(location.search);
  if (MODE_PAR_DEFAUT && !params.has("mode")) params.set("mode", MODE_PAR_DEFAUT);
  var texte = params.toString();
  var url = base + (texte ? "?" + texte : "");
  document.getElementById("lien").href = url;
  location.replace(url);
})();
</script>
</body>
</html>
